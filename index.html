<html>

<head>
  <title>Tagless* Bonsai</title>
</head>

<body style="background-color: black;">
  <script src="wasm_exec.js"></script>
  <script>
    (async () => {
      const go = new globalThis.Go();
      go.run((await WebAssembly.instantiateStreaming(
        fetch("go.wasm"), go.importObject
      )).instance);

      globalThis.setup();
    })().catch(console.error);
  </script>
</body>

</html>
